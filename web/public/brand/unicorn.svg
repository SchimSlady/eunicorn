<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="EUnicorn unicorn">
  <title>EUnicorn unicorn</title>
  <defs>
    <!-- One silhouette: drawn once with an outline, then again without, so inner seams disappear. -->
    <g id="body">
      <ellipse cx="76" cy="78" rx="25" ry="17"/>
      <path d="M50 78 C46 66 44 58 46 50 L64 50 C64 60 66 68 72 74 Z"/>
      <ellipse cx="45" cy="40" rx="20" ry="18"/>
      <ellipse cx="32" cy="50" rx="11.5" ry="9"/>
      <rect x="53" y="84" width="11" height="25" rx="5.5"/>
      <rect x="83" y="84" width="11" height="25" rx="5.5"/>
    </g>
  </defs>
  <g stroke="#6f4f86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M98 70 C118 60 124 82 113 92 C107 98 111 105 118 104 C110 115 92 109 96 96 C98 89 104 84 99 78 Z" fill="#f49ac8"/>
    <path d="M100 76 C110 75 113 84 107 92 C103 97 105 101 109 103 C100 104 96 96 100 89 C103 84 102 80 99 78 Z" fill="#7fd6c8" stroke-width="1.6"/>
    <!-- far legs, a shade darker -->
    <rect x="42" y="86" width="11" height="23" rx="5.5" fill="#efe7f6"/>
    <rect x="71" y="86" width="11" height="23" rx="5.5" fill="#efe7f6"/>
    <use href="#body" fill="#fff"/>
  </g>
  <use href="#body" fill="#fff"/>
  <!-- hooves -->
  <g fill="#9b6fd0" stroke="#6f4f86" stroke-width="2.4" stroke-linejoin="round">
    <path d="M42 103 h11 v2 a4 4 0 0 1 -4 4 h-3 a4 4 0 0 1 -4 -4 Z"/>
    <path d="M71 103 h11 v2 a4 4 0 0 1 -4 4 h-3 a4 4 0 0 1 -4 -4 Z"/>
    <path d="M53 103 h11 v2 a4 4 0 0 1 -4 4 h-3 a4 4 0 0 1 -4 -4 Z"/>
    <path d="M83 103 h11 v2 a4 4 0 0 1 -4 4 h-3 a4 4 0 0 1 -4 -4 Z"/>
  </g>
  <g stroke="#6f4f86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- ear -->
    <path d="M53 27 L61 11 L64 31 Z" fill="#fff"/>
    <path d="M57 25 L60.5 17 L61.8 28 Z" fill="#f9c6dd" stroke="none"/>
    <!-- horn -->
    <path d="M38 25 L43 3 L49 24 Z" fill="#f7cf5a"/>
    <path d="M40 18 L47 15.5 M39.2 22 L48 19.6 M41.4 12.4 L45.6 10.8" stroke="#c9921a" stroke-width="1.5" fill="none"/>
    <!-- mane flowing from the forehead down the back of the neck -->
    <path d="M47 21 C60 14 76 22 72 38 C70 46 72 54 78 62 C66 62 62 54 62 46 C62 38 58 32 50 30 Z" fill="#f49ac8"/>
    <path d="M60 28 C68 32 68 42 67 50 C66 56 69 61 72 65 C63 63 60 55 61 47 C61 40 60 34 57 31 Z" fill="#b48ae0" stroke-width="1.7"/>
    <path d="M51 23 C58 19 66 22 68 31 C62 28 57 30 55 34 Z" fill="#7fd6c8" stroke-width="1.7"/>
    <!-- forelock -->
    <path d="M29 28 C33 19 44 16 51 22 C45 22 41 26 39 31 C36 29 32 29 29 28 Z" fill="#f49ac8"/>
    <path d="M33 26 C37 22 43 21 47 22.5 C43 24.5 41 27 39.5 29 Z" fill="#ffe08a" stroke-width="1.4"/>
  </g>
  <!-- face -->
  <ellipse cx="43" cy="40" rx="5.6" ry="6.8" fill="#3b2a52"/>
  <ellipse cx="41.2" cy="37.4" rx="2.1" ry="2.5" fill="#fff"/>
  <circle cx="45" cy="43.2" r="1.1" fill="#fff"/>
  <path d="M37.5 32.6 C39 30.8 41 30.4 43 30.8" stroke="#3b2a52" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <ellipse cx="35" cy="47.5" rx="4.2" ry="2.7" fill="#f9b7d2" opacity=".9"/>
  <path d="M26.5 53 C29 55.5 32 55.5 34.5 53.2" stroke="#6f4f86" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <circle cx="25.6" cy="48" r="1.3" fill="#6f4f86"/>
  <!-- sparkle on the flank -->
  <path d="M86 72 l1.7 3.8 3.8 1.7 -3.8 1.7 -1.7 3.8 -1.7 -3.8 -3.8 -1.7 3.8 -1.7 Z" fill="#f7cf5a"/>
</svg>
